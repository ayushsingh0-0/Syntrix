services:
  # ===================================================
  # 1. Primary Database: MariaDB 11.4
  # ===================================================
  mariadb:
    image: mariadb:11.4
    container_name: syntrix_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: syntrix
      MYSQL_USER: syntrix_user
      MYSQL_PASSWORD: syntrix_password
    ports:
      - '3306:3306'
    volumes:
      - syntrix_db_data:/var/lib/mysql
    networks:
      - syntrix_network
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===================================================
  # 2. In-Memory Cache & Message Broker: Redis 7.2
  # ===================================================
  redis:
    image: redis:7.2-alpine
    container_name: syntrix_redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - syntrix_redis_data:/data
    networks:
      - syntrix_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ===================================================
  # 3. Backend API Service: Node.js / Express / Prisma
  # ===================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syntrix_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://syntrix_user:syntrix_password@mariadb:3306/syntrix
      JWT_SECRET: super-secure-production-syntrix-jwt-secret-key-32-chars-min
      JWT_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: 'true'
      CORS_ORIGIN: http://localhost
    ports:
      - '5000:5000'
    volumes:
      - syntrix_uploads:/app/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - syntrix_network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===================================================
  # 4. Frontend Client SPA: NGINX / React 19
  # ===================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syntrix_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - syntrix_network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/']
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  syntrix_network:
    driver: bridge

volumes:
  syntrix_db_data:
    driver: local
  syntrix_redis_data:
    driver: local
  syntrix_uploads:
    driver: local
